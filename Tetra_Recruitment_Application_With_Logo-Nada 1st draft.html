function draw(){const d=dict[lang];document.documentElement.lang=lang;document.body.dir=lang==='ar'?'rtl':'ltr';for(const id of ['title','subtitle','footer'])document.getElementById(id).textContent=d[id];document.getElementById('submitBtn').textContent=d.submit;document.getElementById('resetBtn').textContent=d.clear;document.getElementById('english').classList.toggle('active',lang==='en');document.getElementById('arabic').classList.toggle('active',lang==='ar');sections.innerHTML='';schema.forEach((section,i)=>{const el=document.createElement('section');el.className='section';const h=document.createElement('h2');h.textContent=(i+1)+'. '+section[lang];el.appendChild(h);const grid=document.createElement('div');grid.className='grid';section.fields.forEach(f=>{const lab=document.createElement('label');lab.className='field';if(f.type==='audio')lab.classList.add('wide');const title=document.createElement('span');title.textContent=f[lang]+(['Full Name','Mobile Number','Email','Position Applying for'].includes(f.en)?' *':'');lab.appendChild(title);let input;if(options[f.type]){input=document.createElement('select');const opt=document.createElement('option');opt.value='';opt.textContent=d.choose;input.appendChild(opt);options[f.type].forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=d[k];input.appendChild(o)})}else if(f.type==='textarea'){input=document.createElement('textarea')}else{input=document.createElement('input');input.type=['audio','photo'].includes(f.type)?'file':f.type;if(f.type==='audio')input.accept='audio/*';if(f.type==='photo')input.accept='image/*';if(f.type==='number')input.min='0'}input.dataset.key=f.id;if(!['audio','photo'].includes(f.type))input.value=values[f.id]||'';if(['Full Name','Mobile Number','Email','Position Applying for'].includes(f.en))input.required=true;lab.appendChild(input);grid.appendChild(lab);if(f.type==='audio'){const note=document.createElement('div');note.className='note wide';note.textContent=d.audioHint;grid.appendChild(note);const status=document.createElement('p');status.className='status wide';status.id='audioStatus';grid.appendChild(status);input.addEventListener('change',()=>verifyAudio(input))}});el.appendChild(grid);sections.appendChild(el)});document.getElementById('submitStatus').textContent=''}
function verifyAudio(input){const f=input.files?.[0];const status=document.getElementById('audioStatus');if(!f){status.textContent='';return}const url=URL.createObjectURL(f),a=new Audio();a.preload='metadata';a.onloadedmetadata=()=>{const dur=a.duration;URL.revokeObjectURL(url);if(!Number.isFinite(dur)||dur<=0){status.textContent=dict[lang].audioUnknown;status.className='status error';input.value='';return}if(dur>30.1){status.textContent=dict[lang].audioError;status.className='status error';input.value=''}else{status.textContent=(lang==='ar'?'مدة التسجيل: ':'Audio duration: ')+dur.toFixed(1)+(lang==='ar'?' ثانية':' seconds');status.className='status ok'}};a.onerror=()=>{URL.revokeObjectURL(url);status.textContent=dict[lang].audioUnknown;status.className='status error';input.value=''};a.src=url}
document.getElementById('english').onclick=()=>{save();lang='en';draw()};document.getElementById('arabic').onclick=()=>{save();lang='ar';draw()};document.getElementById('resetBtn').onclick=()=>{Object.keys(values).forEach(k=>delete values[k]);document.getElementById('application').reset();draw()};document.getElementById('application').addEventListener('submit',e=>{e.preventDefault();const msg=document.getElementById('submitStatus');msg.textContent=dict[lang].success;msg.className='status ok';msg.scrollIntoView({behavior:'smooth',block:'center'})});draw();
</script></body></html>
